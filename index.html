<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Love ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: radial-gradient(circle, #30000d, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    position: relative;
    z-index: 10;
}

.heart {
    font-size: 120px;
    animation: beat 1s infinite;
    filter: drop-shadow(0 0 25px red);
}

.text {
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin-top: 20px;
    text-shadow: 0 0 10px red, 0 0 25px pink;
    animation: glow 2s infinite alternate;
}

.sub {
    color: pink;
    font-size: 18px;
    margin-top: 10px;
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px red;
    }

    to {
        text-shadow: 0 0 30px red, 0 0 50px pink;
    }
}

.floating-heart {
    position: absolute;
    bottom: -50px;
    font-size: 25px;
    animation: fly linear forwards;
    opacity: 0.8;
}

@keyframes fly {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) scale(1.8);
        opacity: 0;
    }
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
    <div class="heart">❤️</div>

    <div class="text">
        Anh yêu em ❤️
    </div>

    <div class="sub">
        Mãi bên nhau nhé! 💕
    </div>
</div>

<script>

// ===== TIM BAY =====

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💕";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";

    const duration = 4 + Math.random() * 5;
    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, duration * 1000);
}

setInterval(createHeart, 350);


// ===== PHÁO HOA =====

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

let particles = [];

function firework() {

    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height * 0.6;

    for (let i = 0; i < 60; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 80
        });
    }
}

function animate() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.04;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);

        ctx.fillStyle = "white";
        ctx.fill();

        if (p.life <= 0) {
            particles.splice(index, 1);
        }
    });

    requestAnimationFrame(animate);
}

setInterval(firework, 1800);

animate();

</script>

</body>
</html>
