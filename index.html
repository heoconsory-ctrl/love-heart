<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Love ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #450018 0%, #18000b 45%, #000 100%);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== NỀN SAO ===== */

.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* ===== NỘI DUNG ===== */

.container {
    position: relative;
    z-index: 10;
    text-align: center;
}

.heart {
    font-size: 120px;
    filter: drop-shadow(0 0 15px #ff003c)
            drop-shadow(0 0 40px #ff1744);
    animation: beat 1s infinite;
}

.text {
    color: white;
    font-size: 32px;
    font-weight: bold;
    margin-top: 15px;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff1744,
        0 0 30px #ff1744,
        0 0 50px #ff4081;

    animation: glow 2s infinite alternate;
}

.sub {
    color: #ffb6c9;
    font-size: 19px;
    margin-top: 12px;

    text-shadow:
        0 0 8px #ff4081,
        0 0 20px #ff4081;
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }
}

@keyframes glow {
    from {
        opacity: 0.8;
    }

    to {
        opacity: 1;
    }
}

/* ===== TIM BAY ===== */

.floating-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    z-index: 5;

    animation-name: fly;
    animation-timing-function: linear;
    animation-fill-mode: forwards;

    filter: drop-shadow(0 0 8px #ff1744);
}

@keyframes fly {
    0% {
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
            scale(0.7);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(30px)
            rotate(15deg)
            scale(1);
    }

    100% {
        transform:
            translateY(-115vh)
            translateX(-30px)
            rotate(-15deg)
            scale(1.5);

        opacity: 0;
    }
}

/* ===== PHÁO HOA ===== */

canvas {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
    <div class="heart">❤️</div>

    <div class="text">
        Anh yêu em ❤️
    </div>

    <div class="sub">
        Mãi bên nhau nhé! 💕
    </div>
</div>

<script>

/* =========================
   SAO LUNG LINH
========================= */

for (let i = 0; i < 80; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    document.body.appendChild(star);
}


/* =========================
   TIM BAY
========================= */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

    const duration =
        4 + Math.random() * 5;

    heart.style.animationDuration =
        duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, duration * 1000);
}

setInterval(createHeart, 300);


/* =========================
   PHÁO HOA
========================= */

const canvas =
    document.getElementById("fireworks");

const ctx =
    canvas.getContext("2d");

let width;
let height;

function resize() {

    width = canvas.width =
        window.innerWidth;

    height = canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   PARTICLES
========================= */

let particles = [];

function randomColor() {

    const colors = [
        "#ff1744",
        "#ff4081",
        "#ffea00",
        "#00e5ff",
        "#7c4dff",
        "#ffffff",
        "#69f0ae"
    ];

    return colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];
}


/* =========================
   NỔ PHÁO HOA TRÒN
========================= */

function createExplosion(
    x,
    y,
    color
) {

    const count = 90;

    for (let i = 0; i < count; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            2 +
            Math.random() * 6;

        particles.push({

            x: x,
            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                80 +
                Math.random() * 30,

            maxLife: 110,

            color: color,

            size:
                1 +
                Math.random() * 2

        });
    }
}


/* =========================
   PHÁO HOA HÌNH TRÁI TIM
========================= */

function createHeartFirework(
    x,
    y
) {

    const color =
        Math.random() > 0.5
        ? "#ff1744"
        : "#ff4081";

    for (
        let t = 0;
        t < Math.PI * 2;
        t += 0.08
    ) {

        const scale = 7;

        const hx =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );

        const hy =
            -(
                13 *
                Math.cos(t)
                -
                5 *
                Math.cos(2 * t)
                -
                2 *
                Math.cos(3 * t)
                -
                Math.cos(4 * t)
            );

        particles.push({

            x: x,

            y: y,

            vx:
                hx / scale +
                (Math.random() - 0.5) * 0.5,

            vy:
                hy / scale +
                (Math.random() - 0.5) * 0.5,

            life:
                100 +
                Math.random() * 30,

            maxLife: 130,

            color: color,

            size:
                1.5 +
                Math.random() * 2

        });
    }
}


/* =========================
   BẮN PHÁO HOA
========================= */

function launchFirework() {

    const x =
        width *
        (0.15 +
        Math.random() * 0.7);

    const targetY =
        height *
        (0.15 +
        Math.random() * 0.4);

    let y = height;

    const color =
        randomColor();

    const speed =
        8 +
        Math.random() * 3;

    const rocket =
        setInterval(() => {

            y -= speed;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                2.5,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                color;

            ctx.shadowBlur = 15;

            ctx.shadowColor =
                color;

            ctx.fill();

            if (y <= targetY) {

                clearInterval(
                    rocket
                );

                ctx.shadowBlur = 0;

                if (
                    Math.random() <
                    0.25
                ) {

                    createHeartFirework(
                        x,
                        y
                    );

                } else {

                    createExplosion(
                        x,
                        y,
                        color
                    );
                }
            }

        }, 20);
}


/* =========================
   ANIMATION
========================= */

function animate() {

    ctx.fillStyle =
        "rgba(0,0,0,0.15)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.035;

        p.vx *= 0.985;

        p.vy *= 0.985;

        p.life--;

        const alpha =
            p.life /
            p.maxLife;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.globalAlpha =
            Math.max(
                alpha,
                0
            );

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            p.color;

        ctx.fill();

        ctx.globalAlpha = 1;

        if (p.life <= 0) {

            particles.splice(
                i,
                1
            );
        }
    }

    ctx.shadowBlur = 0;

    requestAnimationFrame(
        animate
    );
}


/* =========================
   TẠO PHÁO HOA LIÊN TỤC
========================= */

setInterval(
    launchFirework,
    900
);

animate();

</script>

</body>
</html>
