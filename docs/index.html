<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yêu Lụa ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(35,0,20,0.65)
        ),
        url("B612_20260915_211457_991.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Lớp ánh sáng */
.glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        rgba(255,80,150,0.15),
        transparent 60%
    );
    pointer-events: none;
    z-index: 1;
}

/* Pháo hoa */
canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
}

/* Nội dung */
.container {
    position: relative;
    z-index: 10;
    text-align: center;
}

/* Ảnh Lụa */
.wife {
    width: min(60vw, 240px);
    height: min(60vw, 240px);

    margin: auto;

    border-radius: 50%;
    overflow: hidden;

    border: 5px solid white;

    box-shadow:
        0 0 10px white,
        0 0 25px #ff80ab,
        0 0 50px #ff1744,
        0 0 80px rgba(255,23,68,0.7);

    animation: pulse 2.2s infinite ease-in-out;
}

.wife img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Hiệu ứng nhịp */
@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

/* Chữ */
.love {
    margin-top: 25px;

    color: white;

    font-size: clamp(45px, 12vw, 75px);

    font-weight: bold;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff80ab,
        0 0 30px #ff1744,
        0 0 60px #ff1744;

    animation: textGlow 2s infinite alternate;
}

@keyframes textGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
    }
}

/* Tim bay */
.heart {
    position: fixed;
    bottom: -50px;
    z-index: 5;
    pointer-events: none;

    animation: fly linear forwards;

    filter: drop-shadow(0 0 8px #ff1744);
}

@keyframes fly {
    0% {
        transform:
            translateY(0)
            translateX(0)
            scale(.5);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(35px)
            scale(1);
    }

    100% {
        transform:
            translateY(-115vh)
            translateX(-35px)
            scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<canvas id="fireworks"></canvas>

<div class="container">

    <div class="wife">
        <img src="DSC02939.JPG" alt="Lụa">
    </div>

    <div class="love">
        Yêu Lụa ❤️
    </div>

</div>

<script>

/* =========================
   TIM BAY
========================= */

function createHeart() {

    const h = document.createElement("div");

    h.className = "heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓"
    ];

    h.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    h.style.left =
        Math.random() * 100 + "vw";

    h.style.fontSize =
        15 + Math.random() * 30 + "px";

    const duration =
        4 + Math.random() * 5;

    h.style.animationDuration =
        duration + "s";

    document.body.appendChild(h);

    setTimeout(() => {
        h.remove();
    }, duration * 1000);
}

setInterval(createHeart, 300);


/* =========================
   PHÁO HOA
========================= */

const canvas =
    document.getElementById("fireworks");

const ctx =
    canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

let particles = [];

const colors = [
    "#ff1744",
    "#ff4081",
    "#ff80ab",
    "#ffffff",
    "#ffd740",
    "#7c4dff",
    "#40c4ff"
];


/* Nổ pháo hoa */

function explosion(x, y) {

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    for (let i = 0; i < 90; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            2 + Math.random() * 6;

        particles.push({
            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: 70 + Math.random() * 40,

            color: color,

            size: 1 + Math.random() * 2
        });
    }
}


/* Pháo hoa hình trái tim */

function heartFirework(x, y) {

    for (
        let t = 0;
        t < Math.PI * 2;
        t += 0.06
    ) {

        const scale = 8;

        const hx =
            16 * Math.pow(Math.sin(t), 3);

        const hy =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2*t)
                - 2 * Math.cos(3*t)
                - Math.cos(4*t)
            );

        particles.push({

            x: x,
            y: y,

            vx: hx / scale,
            vy: hy / scale,

            life: 120,

            color: "#ff4081",

            size: 2
        });
    }
}


/* Bắn pháo */

function launch() {

    const x =
        W * (0.1 + Math.random() * 0.8);

    const target =
        H * (0.12 + Math.random() * 0.4);

    let y = H;

    const speed =
        7 + Math.random() * 3;

    const timer = setInterval(() => {

        y -= speed;

        ctx.beginPath();

        ctx.arc(x, y, 2.5, 0, Math.PI * 2);

        ctx.fillStyle = "white";

        ctx.shadowBlur = 15;
        ctx.shadowColor = "white";

        ctx.fill();

        if (y <= target) {

            clearInterval(timer);

            ctx.shadowBlur = 0;

            if (Math.random() < 0.35) {
                heartFirework(x, y);
            } else {
                explosion(x, y);
            }
        }

    }, 18);
}


/* Animation */

function animate() {

    ctx.fillStyle =
        "rgba(0,0,0,0.18)";

    ctx.fillRect(0, 0, W, H);

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.035;

        p.vx *= 0.985;
        p.vy *= 0.985;

        p.life--;

        const alpha =
            Math.max(p.life / 120, 0);

        ctx.globalAlpha = alpha;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;

        ctx.fill();

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}


/* Cứ khoảng 0.9 giây có một quả */

setInterval(launch, 900);

animate();

</script>

</body>
</html>
